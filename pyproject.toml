[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "avready"
version = "0.1.0"
description = "Desk assessment of Singapore's Punggol autonomous shuttle routes from public data"
requires-python = ">=3.11"
license = {text = "MIT"}

[tool.setuptools.packages.find]
where = ["src"]
